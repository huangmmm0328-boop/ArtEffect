name: Publish GAME ART INSIGHT
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack the reviewed website
        run: |
          python3 scripts/unpack-site.py
      - name: Collect the current source rankings
        run: node scripts/refresh-rankings.cjs
      - name: Validate all bundled references
        run: node scripts/check-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy the public review
        id: deployment
        uses: actions/deploy-pages@v4
